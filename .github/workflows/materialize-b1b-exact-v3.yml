name: materialize-b1b-exact-tree-v3

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-b1b-exact-v3.yml"
      - "carrier/b1b-v2-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize carrier chunks and reconstruct exact private tree
        id: materialize
        shell: bash
        run: |
          set +e
          base_commit="fcfe8b72e5df1f0af2aa65feaffcb017994e788b"
          expected_tree="e046f513cbadcde4ba63ed3b60c28b125f0d57f9"
          output_branch="phase2cb-b1b-package-exact"
          expected_overlay_sha="567b70c70b157accd491d8a72119652d80512c2cf4d808737ad992315b301a56"
          tmp="$(mktemp -d)"
          status=0
          actual_tree=""
          exact_commit=""
          actual_overlay_sha=""
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/chunks.sha256" <<'SUMS'
          bae323e32f033410a09924a62c274408db49e4b98ad94e68c56f4b004200ee0e  carrier/b1b-v2-00
          cc40488a0e7953fae75cc986da33c35b5d863e6bd4ec526035499e49978609c8  carrier/b1b-v2-01
          c71a051d010cb417d33e8a1a1f9b1b6d09ee9ab9f9113c1c97b6b740ac033531  carrier/b1b-v2-02
          ee06fb3db435d74b282fc643eb878c18997f0519512fbf3fd43e314f4d3bb634  carrier/b1b-v2-03
          5bd93c2576295252ed779f64967bcf93d5930ffd706a6fbe7dae50ad9819e18e  carrier/b1b-v2-04
          a285b8c793236602fd431911df32b67a6746d3795142618674d51f5634c36c40  carrier/b1b-v2-05
          5913e317f269359631a7bd98579df8adb89ec7884a507b2ec663f9a8f1f2ce63  carrier/b1b-v2-06
          8dc3479c967a0936caa9ff8b0426f2128711febfb90770cf83e73c412680b9bb  carrier/b1b-v2-07
          2309591e33d681d8fc86f69229dbe201bcac2067e5f42f8751f0026560c68322  carrier/b1b-v2-08
          f4986cc410de4dd768f9f568a00d6e37abb956ae04de0a62bbf32aae10f14097  carrier/b1b-v2-09
          SUMS

          {
            echo "Phase 2C-B1b public materialization diagnostic v3"
            echo "carrier_commit=${GITHUB_SHA}"
            echo "base_commit=${base_commit}"
            echo "expected_overlay_sha=${expected_overlay_sha}"
            echo "expected_tree=${expected_tree}"
            echo
            echo "Normalized chunk verification:"
          } > "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"

          while read -r expected file; do
            actual="$(tr -d '[:space:]' < "$file" | sha256sum | awk '{print $1}')"
            echo "$file expected=$expected actual=$actual" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"
            if [[ "$actual" != "$expected" ]]; then status=10; fi
          done < "$tmp/chunks.sha256"
          echo "chunk_status=$([[ "$status" -eq 0 ]] && echo 0 || echo 1)" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"

          if [[ "$status" -eq 0 ]]; then
            for index in 00 01 02 03 04 05 06 07 08 09; do
              tr -d '[:space:]' < "carrier/b1b-v2-${index}"
            done | base64 -d > "$tmp/overlay.tar.gz"
            decode_status=$?
            actual_overlay_sha="$(sha256sum "$tmp/overlay.tar.gz" 2>/dev/null | awk '{print $1}')"
            {
              echo
              echo "decode_status=${decode_status}"
              echo "actual_overlay_sha=${actual_overlay_sha}"
            } >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"
            if [[ "$decode_status" -ne 0 ]]; then status=20; fi
            if [[ "$actual_overlay_sha" != "$expected_overlay_sha" ]]; then status=21; fi
          fi

          if [[ "$status" -eq 0 ]]; then
            git worktree add --detach "$tmp/exact" "$base_commit" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt" 2>&1
            worktree_status=$?
            echo "worktree_status=${worktree_status}" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"
            if [[ "$worktree_status" -ne 0 ]]; then status=30; fi
          fi

          if [[ "$status" -eq 0 ]]; then
            tar -xzf "$tmp/overlay.tar.gz" -C "$tmp/exact" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt" 2>&1
            tar_status=$?
            echo "tar_status=${tar_status}" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"
            if [[ "$tar_status" -ne 0 ]]; then status=31; fi
          fi

          if [[ "$status" -eq 0 ]]; then
            cd "$tmp/exact"
            git add -A
            actual_tree="$(git write-tree)"
            {
              echo "actual_tree=${actual_tree}"
              echo "trees_equal=$([[ "$actual_tree" == "$expected_tree" ]] && echo true || echo false)"
            } >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"
            if [[ "$actual_tree" != "$expected_tree" ]]; then status=40; fi
          fi

          if [[ "$status" -eq 0 ]]; then
            git config user.name "MindMap CI"
            git config user.email "ci@example.invalid"
            git commit -m "CI mirror: exact Phase 2C-B1b one-shot package tree" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt" 2>&1
            exact_commit="$(git rev-parse HEAD)"
            git push origin "HEAD:refs/heads/${output_branch}" --force >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt" 2>&1
            push_status=$?
            echo "push_status=${push_status}" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"
            echo "public_commit=${exact_commit}" >> "$GITHUB_WORKSPACE/b1b-materialization-diagnostic.txt"
            if [[ "$push_status" -ne 0 ]]; then status=50; fi
          fi

          cat > "$GITHUB_WORKSPACE/b1b-materialization-receipt.json" <<JSON
          {
            "format": "mindmap-phase2cb-b1b-public-materialization-v3",
            "statusCode": $status,
            "privateCommit": "7933e0afcba9bb1f3efcc7b95eb42aa6d67b3164",
            "privateTree": "$expected_tree",
            "publicCommit": "$exact_commit",
            "publicTree": "$actual_tree",
            "treesEqual": $([[ -n "$actual_tree" && "$actual_tree" == "$expected_tree" ]] && echo true || echo false),
            "expectedOverlaySha256": "$expected_overlay_sha",
            "actualOverlaySha256": "$actual_overlay_sha",
            "historyTransferred": false,
            "exactSourceIncluded": false,
            "exactSourceOpened": false,
            "migrationExecuted": false,
            "modelCalls": 0
          }
          JSON
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload materialization diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1b-materialization-v3-${{ github.sha }}
          path: |
            b1b-materialization-diagnostic.txt
            b1b-materialization-receipt.json
          if-no-files-found: error
      - name: Fail when exact publication gate failed
        if: steps.materialize.outputs.status != '0'
        run: exit 1
