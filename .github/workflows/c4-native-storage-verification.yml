name: c4-native-storage-verification

on:
  push:
    branches:
      - phase2cc/c4-public-verification
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore isolated full C4 native subset
        run: |
          cat \
            verification/c4-native-full/chunk-00.b64 \
            verification/c4-native-full/chunk-01.b64 \
            verification/c4-native-full/chunk-02.b64 \
            verification/c4-native-full/chunk-03a.b64 \
            verification/c4-native-full/chunk-03b.b64 \
            verification/c4-native-full/chunk-04.b64 \
            verification/c4-native-full/chunk-05.b64 \
            | base64 -d > /tmp/c4-native-full-subset.tar.gz
          echo "1cc9c27c66c8ccd79aa83bed00c0f029842a7e838a14ceab8d83069441fe392a  /tmp/c4-native-full-subset.tar.gz" | sha256sum -c -
          tar -xzf /tmp/c4-native-full-subset.tar.gz
          base64 -d verification/c4-readback-overlay.tar.gz.b64 > /tmp/c4-readback-overlay.tar.gz
          echo "e6dff9816a16b49228536e91bc619032444a6b9892de222932eef19f1c08112e  /tmp/c4-readback-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/c4-readback-overlay.tar.gz
      - run: npm ci
      - name: Strict full C4 native TypeScript verification
        run: >-
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler
          --allowImportingTsExtensions --strict --skipLibCheck --lib ES2022,DOM
          c4-execution/types.ts c4-execution/state-machine.ts c4-execution/authorization-ledger.ts
          c4-execution/state-store.ts c4-execution/fixture-adapters.ts c4-execution/canonical-fixture.ts
          c4-execution/runner-v4.ts c4-execution/native-fixture-backup.ts
          c4-execution/native-fixture-generation.ts c4-execution/native-target-inventory.ts
          c4-execution/native-c2c3-adapters.ts c4-execution/native-runner.ts
          c4-execution/native-promotion-readback.ts c4-execution/native-rollback-readback.ts
      - name: Full native C4 C1 C2 C3 runtime verification
        run: node --experimental-strip-types --test tests/c4-native-full-public-smoke.test.mjs
      - name: Readback no-create regression verification
        run: node --experimental-strip-types --test tests/c4-readback-no-create-public-smoke.test.mjs
