name: materialize-b1a-final-docs

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'carrier/b1a-final-docs-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          ref: carrier/b1a-final-docs-v2
          fetch-depth: 0

      - name: Append exact final documentation blocks
        shell: bash
        run: |
          set -euo pipefail
          cat >> README.md <<'EOF'

          ## Phase 2C-B1a — implemented, final documentation gate pending

          B1a is implemented on sanitized fixtures only. The corrected private head `df2570b6cfea74296248297b7000b29876036e95` and public exact head `76a6da518301fcddbcaa9c3e06fdeb46805dbf6c` share tree `8ef2603b85aef1e7f1ff055cce7579259e3ee659`.

          The exact-tree gate found and corrected two delivery defects before merge: invalid Chrome-runner syntax and an invalid macOS checkout action. The other 17 B1a files were byte-identical to the already tested implementation.

          Passed on the corrected exact tree:

          - verify `30239528354`: Linux lint/full suite, actual Chrome run/graph storage, actual Chrome B1a IndexedDB and macOS launchers;
          - package `30239528365`: source/exporter packaging;
          - downloaded source/exporter/browser artifact inventory, credential, database, personal-data and local-path inspection;
          - deterministic repeated plan/target hashes and injected rollback;
          - source unchanged, exact source unopened, actual migration false, network/model calls zero.

          B1a is not accepted until the final repository-document tree is re-run as an exact public mirror, artifacts are re-inspected, PR #43 is merged and post-merge provenance is recorded. B1b and actual migration remain blocked.
          EOF

          cat >> project-docs/PROJECT_STATUS.md <<'EOF'

          ## Phase 2C-B1a — реализована, финальный documentation gate ожидается

          Исправленный private head `df2570b6cfea74296248297b7000b29876036e95`, public exact head `76a6da518301fcddbcaa9c3e06fdeb46805dbf6c`, общий tree `8ef2603b85aef1e7f1ff055cce7579259e3ee659`. Verify `30239528354` и package `30239528365` прошли. Скачанные source/exporter/browser artifacts проверены.

          Доказанная первопричина задержки: первоначальный commit содержал синтаксически неверный `throw new Error, ...` в Chrome runner и несуществующий `actions/checkout4` в macOS workflow. Exact-tree gate остановил принятие, два файла исправлены, остальные 17 B1a-файлов подтверждены побайтно.

          Доказано на sanitized fixtures: физический read-only SQLite, неизменность source, два одинаковых plan/target hash, native IndexedDB temporary targets, injected rollback без частичного состояния/receipt, typed stops, запрет automatic retry, REQ-OBS trace, zero network/model calls. Exact private source не открывался; actual migration не выполнялась.

          Статус: implemented / not accepted. Следующий шаг — final repository docs commit → corrected exact-tree verify/package/artifact review → merge PR #43 → post-merge provenance. B1b остаётся заблокированной.
          EOF

          cat >> project-docs/RECOVERY_AND_MODEL_BUDGET.md <<'EOF'

          ## Phase 2C-B1a — pre-merge recovery boundary

          Corrected tree `8ef2603b85aef1e7f1ff055cce7579259e3ee659` доказал sanitized read-only source, deterministic two-run equality, native temporary targets, injected rollback, no partial receipt/state, heartbeat/possibly-hung trace and diagnostics download. Portable plan hash `16f82826ae2846136ba2d4f561c0116f17433ce4ab6aa5c3c2c2ab8a4681c52d`; target snapshot hash `6399e23e713214da1574113739e25ea86a220cec8990963c955aeea0a4e73fbf`.

          Exact source opened: false. Actual migration performed: false. Real migration target created: false. Sanitized temporary targets used: true. Network/model calls: 0. Automatic retry: forbidden.

          B1b нельзя запускать до принятия и post-merge provenance B1a и нового явного подтверждения Артёма на один exact-source read-only dry run.
          EOF

      - name: Verify exact private tree and publish exact branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-b1a-final-docs.yml
          git add -A
          expected='58d2bb0e9b7edebb3d3d830064406feffbff5181'
          actual="$(git write-tree)"
          echo "expected_tree=${expected}"
          echo "actual_tree=${actual}"
          test "${actual}" = "${expected}"
          git config user.name 'mindmap-ci-mirror'
          git config user.email 'mindmap-ci-mirror@users.noreply.github.com'
          git commit -m 'ci-mirror: exact B1a final documentation tree'
          git push --force origin HEAD:refs/heads/phase2cb-b1a-final-docs-exact
