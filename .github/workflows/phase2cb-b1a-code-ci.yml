name: phase2cb-b1a-code-ci

on:
  push:
    branches: [phase2cb-b1a-code-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-b1a:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct and verify exact B1a code overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, glob, hashlib
          encoded = "".join(Path(path).read_text(encoding="utf-8") for path in sorted(glob.glob("ci-overlays/phase2cb-b1a/overlay.part*")))
          raw = base64.b64decode("".join(encoded.split()), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "70884a2e0b99b98d458d6f357afc26c73acd7e2dcd6aa88c041b4f10164239da"
          if digest != expected:
              raise SystemExit(f"overlay digest mismatch: {digest}")
          Path("/tmp/b1a-overlay.tar.gz").write_bytes(raw)
          print(f"overlay verified: {digest}")
          PY
          tar -xzf /tmp/b1a-overlay.tar.gz -C .
          test ! -e mindmap-local-semantic-v060.sqlite
          test ! -e mindmap-local-semantic-v060.sqlite3
          test "$(tar -tzf /tmp/b1a-overlay.tar.gz | grep -v '/$' | wc -l | tr -d ' ')" = "19"
          git diff --stat
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Focused accepted-storage and B1a regressions
        run: |
          node --experimental-strip-types --test \
            tests/storage-contract-phase2a.test.mjs \
            tests/native-indexeddb-storage-phase2b.test.mjs \
            tests/graph-storage-phase2ca.test.mjs \
            tests/graph-storage-indexeddb-phase2ca.test.mjs \
            tests/phase2cb-mapping-contract.test.mjs \
            tests/phase2cb-b1a-executor.test.mjs \
            tests/phase2cb-b1a-indexeddb.test.mjs \
            tests/phase2cb-b1a-sqlite-source.test.mjs
      - name: Full test suite
        run: npm test
      - name: Actual Chrome B1a IndexedDB harness
        run: npm run test:browser-phase2cb-b1a
      - name: Materialize clean local B1a commit for packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-overlays/phase2cb-b1a
          rm -f .github/workflows/phase2cb-b1a-code-ci.yml
          git config user.name "mindmap-ci"
          git config user.email "mindmap-ci@users.noreply.github.com"
          git add -A
          git commit -m "ci(b1a): materialize verified code overlay"
          test -z "$(git status --porcelain)"
      - name: Package source and legacy exporter
        run: |
          npm run package:source
          npm run package:legacy-exporter
      - name: Upload B1a logs and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2cb-b1a-code-ci-${{ github.sha }}
          path: |
            release-artifacts/*.zip
            browser-phase2cb-b1a-output.log
            test-output.log
          if-no-files-found: ignore

  macos-b1a:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct and verify exact B1a code overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, glob, hashlib
          encoded = "".join(Path(path).read_text(encoding="utf-8") for path in sorted(glob.glob("ci-overlays/phase2cb-b1a/overlay.part*")))
          raw = base64.b64decode("".join(encoded.split()), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "70884a2e0b99b98d458d6f357afc26c73acd7e2dcd6aa88c041b4f10164239da"
          if digest != expected:
              raise SystemExit(f"overlay digest mismatch: {digest}")
          Path("/tmp/b1a-overlay.tar.gz").write_bytes(raw)
          print(f"overlay verified: {digest}")
          PY
          tar -xzf /tmp/b1a-overlay.tar.gz -C .
          test "$(tar -tzf /tmp/b1a-overlay.tar.gz | grep -v '/$' | wc -l | tr -d ' ')" = "19"
      - run: npm ci
      - name: B1a core and read-only SQLite regressions on macOS
        run: |
          node --experimental-strip-types --test \
            tests/phase2cb-b1a-executor.test.mjs \
            tests/phase2cb-b1a-sqlite-source.test.mjs
      - name: Existing macOS launcher regressions
        run: npm run test:macos
