name: c4-private-checkout-probe

on:
  push:
    branches:
      - phase2cc/c4-public-verification

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attempt private C4 head checkout
        uses: actions/checkout@v4
        with:
          repository: ne-agalakov/mindmap-local
          ref: a68ab60c5e4ab50628ac6dfc4f6d245f3f29e156
          token: ${{ github.token }}
          path: private-head
          persist-credentials: false
      - name: Verify exact private head
        working-directory: private-head
        run: |
          test "$(git rev-parse HEAD)" = "a68ab60c5e4ab50628ac6dfc4f6d245f3f29e156"
          echo "private_head_checkout_ok=true"
