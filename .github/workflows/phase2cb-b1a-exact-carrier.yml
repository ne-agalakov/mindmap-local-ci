name: materialize-phase2cb-b1a-exact-tree

on:
  push:
    branches: [phase2cb-b1a-exact-carrier]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct accepted B0 plus B1 plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root = Path('ci-overlays/phase2cb-b1a-accept-plan')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in sorted(root.glob('part*')))
          Path('/tmp/accept-plan.tar.gz').write_bytes(base64.b64decode(encoded))
          PY
          echo "33c245bfb1279cf954fe5f02602f0cbab49217ec7526a44d5b4f4f892130b73c  /tmp/accept-plan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/accept-plan.tar.gz -C .
      - name: Reconstruct exact B1a implementation overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root = Path('ci-overlays/phase2cb-b1a')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in sorted(root.glob('overlay.part*')))
          Path('/tmp/b1a.tar.gz').write_bytes(base64.b64decode(encoded))
          PY
          echo "70884a2e0b99b98d458d6f357afc26c73acd7e2dcd6aa88c041b4f10164239da  /tmp/b1a.tar.gz" | sha256sum -c -
          test "$(tar -tzf /tmp/b1a.tar.gz | grep -v '/$' | wc -l | tr -d ' ')" = "19"
          tar -xzf /tmp/b1a.tar.gz -C .
      - name: Prove and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-overlays
          rm -f .github/workflows/phase2cb-b1a-exact-carrier.yml
          test ! -e mindmap-local-semantic-v060.sqlite
          test ! -e mindmap-local-semantic-v060.sqlite3
          git add -A
          actual_tree="$(git write-tree)"
          expected_tree="2ad85a074d941a1d946ab8111d7cdb62b1ce8f55"
          echo "actual_tree=$actual_tree"
          echo "expected_tree=$expected_tree"
          test "$actual_tree" = "$expected_tree"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci(phase2cb-b1a): exact private PR #43 tree"
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          git push --force origin HEAD:phase2cb-b1a-exact-tree
